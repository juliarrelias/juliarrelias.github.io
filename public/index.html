<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Laboratório de autenticação</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
      :root {
        --ink: #17203a;
        --muted: #5d6885;
        --line: rgba(23, 32, 58, 0.12);
        --accent: #5b5bff;
        font-family: "Sora", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        color: var(--ink);
        background: #f1efff;
        overflow-x: hidden;
        position: relative;
      }

      /* Fundo: pontos + manchas de cor */
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        background-image: radial-gradient(rgba(23, 32, 58, 0.14) 1px, transparent 1px);
        background-size: 24px 24px;
        mask-image: radial-gradient(ellipse at center, #000 30%, transparent 75%);
        -webkit-mask-image: radial-gradient(ellipse at center, #000 30%, transparent 75%);
        pointer-events: none;
      }
      .blob {
        position: fixed;
        border-radius: 50%;
        filter: blur(70px);
        opacity: 0.75;
        pointer-events: none;
        animation: drift 18s ease-in-out infinite alternate;
      }
      .blob.a { width: 420px; height: 420px; background: #9db8ff; top: -120px; left: -100px; }
      .blob.b { width: 380px; height: 380px; background: #ffc2dd; bottom: -120px; right: -80px; animation-delay: -6s; }
      .blob.c { width: 300px; height: 300px; background: #b5efdc; bottom: 20%; left: 8%; animation-delay: -12s; }
      @keyframes drift {
        from { transform: translate(0, 0) scale(1); }
        to   { transform: translate(40px, 30px) scale(1.12); }
      }

      /* Cartão */
      .card {
        position: relative;
        width: 100%;
        max-width: 420px;
        padding: 56px 32px 28px;
        text-align: center;
        background: rgba(255, 255, 255, 0.78);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        border: 1px solid rgba(255, 255, 255, 0.9);
        border-radius: 28px;
        box-shadow:
          0 1px 0 rgba(255, 255, 255, 0.9) inset,
          0 30px 70px -30px rgba(60, 60, 160, 0.45);
      }

      /* Selo com anéis no topo do cartão */
      .seal {
        position: absolute;
        top: -34px;
        left: 50%;
        width: 68px;
        height: 68px;
        transform: translateX(-50%);
        display: grid;
        place-items: center;
        border-radius: 50%;
        color: #fff;
        background: linear-gradient(135deg, #5b5bff, #8f6bff);
        box-shadow: 0 10px 24px -8px rgba(91, 91, 255, 0.7);
      }
      .seal::before,
      .seal::after {
        content: "";
        position: absolute;
        border-radius: 50%;
        border: 1px solid rgba(91, 91, 255, 0.35);
      }
      .seal::before { inset: -9px; }
      .seal::after  { inset: -19px; border-color: rgba(91, 91, 255, 0.16); }

      h1 {
        margin: 0 0 8px;
        font-size: 1.55rem;
        line-height: 1.2;
        font-weight: 700;
        letter-spacing: -0.02em;
      }
      .lead {
        margin: 0 0 20px;
        color: var(--muted);
        font-size: 0.95rem;
      }

      /* Selos informativos */
      .chips {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 8px;
        margin: 0 0 26px;
        padding: 0;
        list-style: none;
      }
      .chips li {
        padding: 5px 11px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.7);
        color: var(--muted);
        font-size: 0.75rem;
        font-weight: 600;
      }

      /* Botões */
      .btn {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        width: 100%;
        padding: 14px 16px;
        margin-bottom: 12px;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: #fff;
        color: var(--ink);
        font: inherit;
        font-weight: 600;
        font-size: 0.95rem;
        text-decoration: none;
        box-shadow: 0 2px 0 rgba(23, 32, 58, 0.06);
        transition: transform 0.15s, box-shadow 0.15s, border-color 0.15s;
      }
      .btn:hover {
        transform: translateY(-2px);
        border-color: var(--accent);
        box-shadow: 0 12px 24px -14px rgba(91, 91, 255, 0.7);
      }
      .btn:focus-visible,
      .logout:focus-visible {
        outline: 3px solid var(--accent);
        outline-offset: 2px;
      }

      /* Estado da sessão */
      #status {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        margin: 22px 0 6px;
        padding: 10px 14px;
        border-radius: 12px;
        background: rgba(91, 91, 255, 0.08);
        color: var(--muted);
        font-size: 0.85rem;
      }
      #status::before {
        content: "";
        flex: none;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--accent);
        box-shadow: 0 0 0 4px rgba(91, 91, 255, 0.18);
      }

      .logout {
        display: block;
        margin: 0 auto;
        padding: 8px 14px;
        border: 0;
        background: none;
        color: var(--muted);
        font: inherit;
        font-size: 0.85rem;
        text-decoration: underline;
        cursor: pointer;
      }
      .logout:hover { color: var(--ink); }

      .note {
        margin: 14px 0 0;
        padding-top: 14px;
        border-top: 1px dashed var(--line);
        color: var(--muted);
        font-size: 0.75rem;
      }

      @media (prefers-reduced-motion: reduce) {
        .blob { animation: none; }
        .btn { transition: none; }
        .btn:hover { transform: none; }
      }
    </style>
  </head>
  <body>
    <div class="blob a" aria-hidden="true"></div>
    <div class="blob b" aria-hidden="true"></div>
    <div class="blob c" aria-hidden="true"></div>

    <main class="card">
      <div class="seal" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="4" y="11" width="16" height="10" rx="2.5"/>
          <path d="M8 11V8a4 4 0 0 1 8 0v3"/>
          <circle cx="12" cy="16" r="1.2" fill="currentColor"/>
        </svg>
      </div>

      <h1>Laboratório de autenticação</h1>
      <p class="lead">Escolha uma conta para entrar.</p>

      <ul class="chips" aria-label="Recursos de segurança">
        <li>OAuth 2.0</li>
        <li>PKCE</li>
        <li>Sessão de 8 horas</li>
      </ul>

      <a class="btn" href="/oauth/login/google">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
          <path fill="#4285F4" d="M23.5 12.27c0-.85-.08-1.67-.22-2.45H12v4.64h6.46a5.52 5.52 0 0 1-2.4 3.62v3h3.88c2.27-2.09 3.56-5.17 3.56-8.81z"/>
          <path fill="#34A853" d="M12 24c3.24 0 5.96-1.07 7.95-2.9l-3.88-3c-1.08.72-2.45 1.15-4.07 1.15-3.13 0-5.78-2.11-6.73-4.96H1.27v3.09A12 12 0 0 0 12 24z"/>
          <path fill="#FBBC05" d="M5.27 14.29a7.2 7.2 0 0 1 0-4.58V6.62H1.27a12 12 0 0 0 0 10.76l4-3.09z"/>
          <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0A12 12 0 0 0 1.27 6.62l4 3.09C6.22 6.86 8.87 4.75 12 4.75z"/>
        </svg>
        <span>Entrar com Google</span>
      </a>

      <a class="btn" href="/oauth/login/github">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
          <path fill="currentColor" d="M12 .5C5.65.5.5 5.65.5 12c0 5.08 3.29 9.39 7.86 10.91.58.1.79-.25.79-.56v-2c-3.2.7-3.87-1.36-3.87-1.36-.52-1.33-1.28-1.68-1.28-1.68-1.05-.72.08-.7.08-.7 1.16.08 1.77 1.19 1.77 1.19 1.03 1.77 2.7 1.26 3.36.96.1-.75.4-1.26.73-1.55-2.55-.29-5.24-1.28-5.24-5.68 0-1.25.45-2.28 1.19-3.08-.12-.29-.52-1.46.11-3.04 0 0 .97-.31 3.17 1.18a11 11 0 0 1 5.77 0c2.2-1.49 3.17-1.18 3.17-1.18.63 1.58.23 2.75.11 3.04.74.8 1.19 1.83 1.19 3.08 0 4.41-2.69 5.38-5.25 5.67.41.36.78 1.06.78 2.14v3.17c0 .31.21.67.8.56A11.5 11.5 0 0 0 23.5 12C23.5 5.65 18.35.5 12 .5Z"/>
        </svg>
        <span>Entrar com GitHub</span>
      </a>

      <p id="status" role="status">A sessão ainda não foi consultada.</p>

      <form method="post" action="/oauth/logout">
        <button class="logout" type="submit">Sair</button>
      </form>

      <p class="note">Sua sessão fica em um cookie HttpOnly. Nenhum token chega ao navegador.</p>
    </main>
    <script src="/app.js" defer></script>
  </body>
</html>
